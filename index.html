<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直嘎廚房 - 主頁介紹</title>
    <link rel="stylesheet" href="ind.css">
</head>
<body>

    <!-- 頂部導覽列 Navbar -->
    <nav class="navbar">
        <div class="nav-title">直嘎廚房系統</div>
        <div class="nav-links">
            <a href="index.html" class="nav-item active">主頁</a>
            <a href="main.html" class="nav-item">廚房</a>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <div class="main-container">
        
        <!-- 廚房簡介區塊 -->
        <section class="intro-section">
            <h2>關於我們的直嘎廚房</h2>
            <div class="intro-content">
                <div class="intro-img-wrapper">
                    <img src="https://www.sakura-kitchenlife.com.tw/uploads/photos/shares/knowledge/42/IFUN-1_1170x880.jpg" alt="廚房環境" class="intro-img">
                </div>
                <div class="intro-text">
                    <p>歡迎來到直嘎廚房！我們致力於提供最具想像力的料理組合。</p>
                    <p>在這裡，你可以透過我們獨特的食材搭配系統，自由選擇兩種食材並放入盤中，打造專屬於你的特色料理。無論是經典美食還是意想不到的新穎滋味，直嘎廚房都能滿足你的想像！</p>
                </div>
            </div>
        </section>

        <!-- 工作人員名單區塊 -->
        <section class="team-section">
            <h2>靈魂團隊成員</h2>
            <div class="team-grid" id="teamGrid">
                <!-- 由 inde.js 動態生成 4 位成員資料 -->
            </div>
        </section>

    </div>

    <script src="inde.js"></script>
</body>
</html>
